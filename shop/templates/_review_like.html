{% if user.is_authenticated %}{% if r.user_id == user.id %}<span class="inline-flex items-center gap-1 text-[11px] font-mono text-stone-400" title="Your review"><i class="fa-regular fa-heart"></i>{{ r.like_count }}</span>{% else %}<form method="post" action="{% url 'review_like' r.pk %}" class="inline">{% csrf_token %}<input type="hidden" name="next" value="{{ next_url }}"><button type="submit" aria-pressed="{% if r.pk in liked_ids %}true{% else %}false{% endif %}" title="{% if r.pk in liked_ids %}Remove your like{% else %}Like this review{% endif %}" class="inline-flex items-center gap-1 text-[11px] font-mono px-2 py-1 rounded border border-stoneLine bg-white hover:border-noir transition-colors {% if r.pk in liked_ids %}text-rose-500{% else %}text-stone-500{% endif %}"><i class="{% if r.pk in liked_ids %}fa-solid{% else %}fa-regular{% endif %} fa-heart"></i>{{ r.like_count }}</button></form>{% endif %}{% else %}<a href="{% url 'login' %}?next={{ next_url|urlencode }}" title="Log in to like" class="inline-flex items-center gap-1 text-[11px] font-mono px-2 py-1 rounded border border-stoneLine bg-white text-stone-500 hover:border-noir transition-colors"><i class="fa-regular fa-heart"></i>{{ r.like_count }}</a>{% endif %}
