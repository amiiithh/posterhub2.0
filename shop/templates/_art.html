{% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.title }}" class="poster-art">{% else %}<div class="poster-art-placeholder" style="background:linear-gradient(135deg,hsl({{ p.hue }},50%,12%),hsl({{ p.hue|add:40 }},60%,38%))"><span class="art-title">{{ p.title }}</span><span class="art-artist">{{ p.artist }}</span></div>{% endif %}
